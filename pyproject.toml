[project]
name = "deployment-readiness-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Antwone Walters", email = "antwone@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
deployment-readiness-service = "deployment_readiness_service:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
